# Rest of transactions

## Protagonist's archive transactions

<%
  transaction_date_from_the_begging_of_the_month = lambda do |offset_from_the_start_of_the_month|
    date = Time.current.beginning_of_month + offset_from_the_start_of_the_month

    if date.future?
      date - 1.month
    else
      date
    end
  end
%>

protagonist_archive_donations_from_the_previous_month_transaction:
  <<: *protagonist_archive_base_transaction
  from: protagonist_archive_donations_income
  to: protagonist_archive_checking_account
  from_amount: 3000.00
  to_amount: 3000.00
  issued_at: <%= issued_at = transaction_date_from_the_begging_of_the_month.call(24.days) %>
  executed_at: <%= issued_at + 3.days %>


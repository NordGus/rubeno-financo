# Read about fixtures at https://api.rubyonrails.org/classes/ActiveRecord/FixtureSet.html

_fixture:
  ignore:
    - protagonist_archive_base_transaction
    - protagonist_shared_family_archive_base_transaction

protagonist_archive_base_transaction: &protagonist_archive_base_transaction
  archive: protagonist_archive
  currency: <%= Account.currencies[:usd] %>

protagonist_shared_family_archive_base_transaction: &protagonist_shared_family_archive_base_transaction
  archive: protagonist_shared_family_archive
  currency: <%= Account.currencies[:eur] %>

# History transactions
# Protagonist's archive transactions

protagonist_archive_checking_account_history_transaction:
  <<: *protagonist_archive_base_transaction
  from: protagonist_archive_checking_account_history
  to: protagonist_archive_treasure_account
  from_amount: 1334.42
  to_amount: 1334.42
  issued_at: <%= Time.current - (4.months + 21.days) %>
  execute_at: <%= Time.current - (4.months + 21.days) %>


# Read about fixtures at https://api.rubyonrails.org/classes/ActiveRecord/FixtureSet.html

_fixture:
  ignore:
    - protagonist_file_system_item_mount_base
    - protagonist_shared_family_archive

DEFAULTS: &DEFAULTS
  type: <%= FileSystem::Item::Mount.name %>
  version: <%= Time.current.to_fs(:number) %>

protagonist_file_system_item_mount_base: &protagonist_file_system_item_mount_base
  <<: *DEFAULTS
  archive: protagonist_archive

protagonist_shared_family_file_system_item_mount_base: &protagonist_shared_family_file_system_item_mount_base
  <<: *DEFAULTS
  archive: protagonist_shared_family_archive


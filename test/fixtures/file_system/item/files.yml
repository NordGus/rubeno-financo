# Read about fixtures at https://api.rubyonrails.org/classes/ActiveRecord/FixtureSet.html

# We are only populating protagonist_archive_checking_account and protagonist_archive_bounty_income file systems with
# some data for demonstration purposes.
#
# The idea is to show a full order system structure with multiple directories, nested directories and files with its
# versions for protagonist_archive_checking_account and a simple flat one with all the files, some with versions, in the
# root of the file system for protagonist_archive_bounty_income.

_fixture:
  ignore:
    - protagonist_archive_checking_account_file_system_base_item
    - protagonist_shared_family_archive_checking_account_file_system_base_item

protagonist_archive_checking_account_file_system_base_item: &protagonist_archive_checking_account_file_system_base_item
  archive: protagonist_archive
  parentable: protagonist_archive_checking_account_file_system (FileSystem)

DEFAULTS: &DEFAULTS
  type: <%= FileSystem::Item::File.name %>
  version: <%= Time.current.to_fs(:number) %>


# Root > Bounties > Current Year

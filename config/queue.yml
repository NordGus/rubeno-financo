default: &default
  dispatchers:
    - polling_interval: 1
      batch_size: 500
  workers:
    - queues:
        - high_priority
        - default
        - active_storage_analysis
        - active_storage_preview_image
        - active_storage_transform
        - active_storage_mirror
        - active_storage_purge
        - low_priority
        - background
      threads: 3
      processes: <%= ENV.fetch("JOB_CONCURRENCY", 1) %>
      polling_interval: 0.1

development:
  <<: *default

test:
  <<: *default

production:
  <<: *default
